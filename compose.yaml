services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "9000:9000"

    environment:
      DEMO_ADMIN_ID: "demo-admin"

    volumes:
      - platform-admin-data:/app/data

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/frontend/src

        - action: rebuild
          path: ./backend/src

        - action: rebuild
          path: ./Dockerfile

volumes:
  platform-admin-data: