services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      DEMO_ADMIN_ID: "demo-admin"
      DB_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      DB_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - platform-admin-data:/app/data
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/frontend/src
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./Dockerfile

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGCONNECT_TIMEOUT: "5"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./backend/src/database/migrations:/migrations:ro
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1"]
    command: ["-f", "/migrations/001_admin_records.sql"]
    restart: "no"

volumes:
  platform-admin-data:
  postgres-data:
